name: Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, for example 0.1.0"
        required: false
        type: string
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version -and "${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }

          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          if ($version) {
            .\installer\build-installer.ps1 -Version $version
          } else {
            .\installer\build-installer.ps1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimal-switcher-installer
          path: artifacts/installer/*.exe

  publish-release:
    needs: build-installer
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    environment: release

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: minimal-switcher-installer
          path: artifacts/installer

      - name: Publish GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem artifacts/installer/*.exe | Select-Object -First 1
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Release ${{ github.ref_name }}"
          }
          gh release upload "${{ github.ref_name }}" $installer.FullName --clobber
